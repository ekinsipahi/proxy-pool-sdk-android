name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here — see SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: "The exact model matters — vendor battery managers differ wildly. e.g. 'Xiaomi Mi Box S, Android 9' or 'Pixel 8 emulator, API 34'"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your SdkConfig
      description: Redact the API key.
      render: kotlin

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `adb logcat -s ProxyPoolSdk:*` with `debugLogging = true`, and the
        coordinator's output if you have both halves. A disconnect looks the
        same from a dozen causes; the two logs together usually tell them apart.
      render: text
